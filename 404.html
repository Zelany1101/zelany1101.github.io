<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ribbit</title>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--paper:#fff;--dot:#0002;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#fff;--paper:#000;--dot:#fff3}}
:root[data-theme="dark"]{--ink:#fff;--paper:#000;--dot:#fff3}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Gochi Hand","Comic Sans MS","Chalkboard SE",cursive;
background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:22px 22px;overflow:hidden}
svg{overflow:visible}
.ink{fill:var(--paper);stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.solid{fill:var(--ink);stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.line{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.wob{filter:url(#rough)}

/* loader */
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;background:var(--paper);z-index:5;transition:opacity .4s,visibility .4s;padding:1rem}
#loader.done{opacity:0;visibility:hidden}
.track{position:relative;width:min(80vw,460px);height:34px;border:4px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);background:var(--paper);filter:url(#rough)}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:14px;
background:repeating-linear-gradient(-45deg,var(--ink) 0 5px,var(--paper) 5px 10px)}
.hopper{position:absolute;bottom:100%;left:0;width:64px;margin:0 0 -4px -32px;transform:translateX(0)}
.hopper svg{width:100%;height:auto;animation:hop .32s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-14px) rotate(-6deg)}}
#pct{font-size:1.6rem}

/* home */
main{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(1rem,4vh,2.2rem);padding:1.5rem;text-align:center;opacity:0;visibility:hidden}
main.show{visibility:visible;opacity:1}
.logo{width:clamp(140px,34vmin,260px)}
.logo svg{width:100%;height:auto}
main.show .logo{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:translateY(60px) scale(.6)}60%{transform:translateY(-16px) scale(1.05)}100%{transform:none}}
h1{margin:0;font-weight:400;font-size:clamp(2rem,7vmin,3.4rem);letter-spacing:.02em}
nav{display:flex;flex-direction:column;gap:clamp(.8rem,2.5vh,1.3rem);width:min(86vw,340px)}
@media (min-width:760px) and (min-height:560px){nav{flex-direction:row;width:auto;gap:1.6rem}}
nav a{display:block;padding:.55em 1.4em;font-size:clamp(1.5rem,4.5vmin,2rem);color:var(--ink);background:var(--paper);text-decoration:none;
border:4px solid var(--ink);border-radius:18px 24px 16px 26px / 24px 16px 26px 18px;box-shadow:6px 6px 0 var(--ink);transition:transform .12s,box-shadow .12s}
nav a:nth-child(2){transform:rotate(-1.5deg)}
nav a:nth-child(3){transform:rotate(1.2deg)}
nav a:hover,nav a:focus-visible{transform:translate(4px,4px) rotate(0);box-shadow:2px 2px 0 var(--ink);background:var(--ink);color:var(--paper);outline:none}
nav a:focus-visible{outline:3px dashed var(--ink);outline-offset:5px}
/* reduced-motion: keep the loader and hop, only calm the big bounce */
@media (prefers-reduced-motion:reduce){main.show .logo{animation:none}.hopper svg{animation-duration:.8s}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
